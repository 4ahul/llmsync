version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: llmsync-postgres
    environment:
      POSTGRES_DB: llmsync
      POSTGRES_USER: llmsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmsync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: llmsync-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: llmsync-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-llmsync}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-llmsync123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llmsync-api
    environment:
      DATABASE_URL: postgresql+asyncpg://llmsync:${POSTGRES_PASSWORD:-llmsync}@postgres:5432/llmsync
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-llmsync}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-llmsync123}
      MINIO_BUCKET: llmsync-files
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn llmsync.main:app --host 0.0.0.0 --port 8000 --reload

  # Cleanup Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llmsync-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://llmsync:${POSTGRES_PASSWORD:-llmsync}@postgres:5432/llmsync
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-llmsync}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-llmsync123}
      MINIO_BUCKET: llmsync-files
      MINIO_SECURE: "false"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend:/app
    command: python cleanup_worker.py

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: llmsync-network
