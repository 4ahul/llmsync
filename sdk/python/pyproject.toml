[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsync-sdk"
version = "0.1.0"
description = "Python SDK for LLMSync - E2E encrypted conversation sync"
authors = [{name = "LLMSync Contributors"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["llm", "sync", "encryption", "e2ee", "conversations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.26.0",
    "websockets>=12.0",
    "PyNaCl>=1.5.0",
    "cryptography>=42.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/llmsync"
Documentation = "https://llmsync.readthedocs.io"
Repository = "https://github.com/yourusername/llmsync"
